[workspace]
members = ["programs/*"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
# Optimize for size: a smaller program costs less rent to deploy and upgrade.
opt-level = "s"

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
